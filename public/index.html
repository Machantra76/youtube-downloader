<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f0f2f5; }
        .card { border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 600px;">
        <div class="card p-4 bg-white">
            <h3 class="text-center fw-bold text-danger mb-3">📥 ទាញយកវីដេអូ YouTube</h3>
            <p class="text-center text-muted small mb-4">ដាក់បញ្ចូលลิงก์ YouTube ដើម្បីទាញយកវីដេអូរបស់អ្នក</p>
            
            <div class="mb-3">
                <input type="text" class="form-control form-control-lg" id="videoUrl" placeholder="បិទភ្ជាប់ลิงก์ YouTube ទីនេះ (https://youtu.be/...)">
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">ជ្រើសរើសកម្រិតវីដេអូ (Quality):</label>
                <select class="form-select" id="videoQuality">
                    <option value="highest">ច្បាស់បំផុត (Highest Quality)</option>
                    <option value="lowest">ធម្មតា / រហ័ស (Lowest Quality)</option>
                </select>
            </div>

            <button onclick="startDownload()" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm" id="downloadBtn">
                📥 ចុចទាញយកវីដេអូ (Download)
            </button>

            <div id="statusMessage" class="text-center mt-3 small fw-bold"></div>
        </div>
    </div>

    <script>
        function startDownload() {
            let url = document.getElementById('videoUrl').value.trim();
            let quality = document.getElementById('videoQuality').value;
            let statusMsg = document.getElementById('statusMessage');

            if (!url) {
                alert("⚠ សូមដាក់បញ្ចូលลิงก์ YouTube ជាមុនសិន!");
                return;
            }

            statusMsg.innerHTML = '<span class="text-primary">⏳ កំពុងរៀបចំទាញយកវីដេអូ... សូមរង់ចាំបន្តិច!</span>';

            // បើក Link Download ដោយផ្ទាល់ដើម្បីឱ្យ Browser ទាញយកចូលម៉ាស៊ីន
            window.location.href = `/download?url=${encodeURIComponent(url)}&quality=${quality}`;

            setTimeout(() => {
                statusMsg.innerHTML = '<span class="text-success">✅ ការទាញយកបានចាប់ផ្តើមរួចរាល់!</span>';
            }, 3000);
        }
    </script>
</body>
</html>
