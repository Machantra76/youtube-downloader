<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធទាញយកវីដេអូ YouTube (YouTube Video Downloader)</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif; 
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 0;
        }
        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #f8fafc;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .form-control::placeholder { color: #64748b; }
        .btn-download {
            background-color: var(--accent-color);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: white;
            transition: all 0.2s;
        }
        .btn-download:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }
        .app-badge {
            background-color: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 50rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .table-dark-custom {
            background-color: transparent;
            color: var(--text-primary);
        }
        .table-dark-custom th {
            background-color: #0f172a;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .table-dark-custom td {
            background-color: transparent;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        
        <!-- Form Downloader -->
        <div class="card-custom">
            <div class="text-center mb-4">
                <div class="mb-3">
                    <span class="app-badge">
                        <i class="bi bi-youtube text-danger"></i> YouTube Media Engine
                    </span>
                </div>
                <h3 class="fw-bold text-white mb-2 fs-4">ទាញយកវីដេអូ YouTube</h3>
                <p class="text-secondary small m-0">បិទភ្ជាប់លីង (URL) ដើម្បីទាញយកវីដេអូរបស់អ្នកដោយសុវត្ថិភាព</p>
            </div>
            
            <div class="mb-3">
                <label class="form-label small text-secondary fw-bold mb-2">តំណភ្ជាប់វីដេអូ (Video URL)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary rounded-start-3"><i class="bi bi-link-45deg"></i></span>
                    <input type="text" class="form-control border-start-0" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small text-secondary fw-bold mb-2">កម្រិតគុណភាពវីដេអូ (Quality)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary rounded-start-3"><i class="bi bi-sliders"></i></span>
                    <select class="form-select border-start-0" id="videoQuality">
                        <option value="highest">ច្បាស់បំផុត (Highest Quality - HD)</option>
                        <option value="lowest">ធម្មតា / រហ័ស (Standard Quality)</option>
                    </select>
                </div>
            </div>

            <button onclick="startDownload()" class="btn btn-download w-100 shadow-sm" id="downloadBtn">
                <i class="bi bi-cloud-arrow-down-fill me-2"></i> ចុចទាញយកវីដេអូ (Download)
            </button>

            <div id="statusMessage" class="text-center mt-3 small fw-semibold"></div>
        </div>

        <!-- Download History Table -->
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold text-white m-0 fs-5"><i class="bi bi-clock-history me-2 text-indigo"></i> ប្រវត្តិនៃการទាញយក (Download History)</h5>
                <button onclick="loadHistory()" class="btn btn-sm btn-outline-secondary text-white"><i class="bi bi-arrow-clockwise"></i> ផ្ទុកឡើងវិញ</button>
            </div>
            <div class="table-responsive">
                <table class="table table-dark-custom align-middle">
                    <thead>
                        <tr>
                            <th>ល.រ (No)</th>
                            <th>ចំណងជើងវីដេអូ (Title)</th>
                            <th>តំណភ្ជាប់ (URL)</th>
                            <th>កាលបរិច្ឆេទ (Date)</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="4" class="text-center text-secondary py-3">កំពុងទាញទិន្នន័យ...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function startDownload() {
            let url = document.getElementById('videoUrl').value.trim();
            let quality = document.getElementById('videoQuality').value;
            let statusMsg = document.getElementById('statusMessage');

            if (!url) {
                alert("⚠ សូមដាក់បញ្ចូលតំណភ្ជាប់ YouTube ជាមុនសិន!");
                return;
            }

            statusMsg.innerHTML = '<span class="text-info"><span class="spinner-border spinner-border-sm me-1"></span> កំពុងរៀបចំទាញយកវីដេអូ... សូមរង់ចាំបន្តិច!</span>';

            // បើក Link Download ដោយផ្ទាល់ដើម្បីឱ្យ Browser ចាប់ផ្តើមទាញយក File MP4 ចូលเครื่อง
            window.location.href = `/download?url=${encodeURIComponent(url)}&quality=${quality}`;

            setTimeout(() => {
                statusMsg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i> ការទាញយកបានចាប់ផ្តើម! សូមពិនិត្យមើល Download Manager ក្នុងเครื่องរបស់អ្នក។</span>';
                // ផ្ទុកប្រវត្តិសាស្រ្តឡើងវិញបន្ទាប់ពី Download
                setTimeout(loadHistory, 4000);
            }, 3000);
        }
        async function startDownload() {
            let url = document.getElementById('videoUrl').value.trim();
            let quality = document.getElementById('videoQuality').value;
            let statusMsg = document.getElementById('statusMessage');

            if (!url) {
                alert("⚠ សូមដាក់បញ្ចូលតំណភ្ជាប់ YouTube ជាមុនសិន!");
                return;
            }

            statusMsg.innerHTML = '<span class="text-info"><span class="spinner-border spinner-border-sm me-1"></span> កំពុងរៀបចំប្រព័ន្ធទាញយក... សូមរង់ចាំបន្តិច!</span>';

            try {
                let response = await fetch(`/download?url=${encodeURIComponent(url)}&quality=${quality}`);
                let result = await response.json();

                if (result.success) {
                    statusMsg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i> កត់ត្រាប្រវត្តិជោគជ័យ! កំពុងបើកទំព័រទាញយក...</span>';
                    // បើកទំព័រទាញយកវីដេអូក្នុង Tab ថ្មី
                    window.open(result.redirectUrl, '_blank');
                    // ផ្ទុកតារាងប្រវត្តិឡើងវិញ
                    setTimeout(loadHistory, 2500);
                } else {
                    statusMsg.innerHTML = `<span class="text-danger">❌ ${result.error}</span>`;
                }
            } catch (err) {
                statusMsg.innerHTML = '<span class="text-danger">❌ មានបញ្ហាក្នុងការតភ្ជាប់ Server!</span>';
            }
        }

        async function loadHistory() {
            try {
                let response = await fetch('/api/history');
                let result = await response.json();
                let tbody = document.getElementById('historyTableBody');
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach((item, index) => {
                        let dateStr = new Date(item.created_at).toLocaleString('km-KH');
                        tbody.innerHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td class="text-truncate" style="max-width: 250px;" title="${item.video_title || 'គ្មានចំណងជើង'}">${item.video_title || 'គ្មានចំណងជើង'}</td>
                                <td><a href="${item.video_url}" target="_blank" class="text-info text-decoration-none text-truncate d-inline-block" style="max-width: 180px;"><i class="bi bi-box-arrow-up-right"></i> មើលលីង</a></td>
                                <td class="text-secondary small">${dateStr}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-secondary py-3">មិនទាន់មានប្រវត្តិទាញយកនៅឡើយទេ។</td></tr>`;
                }
            } catch (err) {
                console.error("Error loading history:", err);
                document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">មានបញ្ហាក្នុងការទាញទិន្នន័យប្រវត្តិ!</td></tr>`;
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
